# ==============================================
# Conda environment file for the FrameIt project
# ==============================================
#
# To create and activate the environment:
#
# 1. Create the environment:
#    conda env create -f environment.yaml
#
# 2. Activate it:
#    conda activate frameit_env
#
# 3. To update later:
#    conda env update -f environment.yaml --prune
#
# 4. To deactivate:
#    conda deactivate
#
# Procedure to recreate the env:
#    conda deactivate
#    conda env remove -n frameit_env
#    conda env create -f environment.yaml
#
# Python 3.13 provides published falfilfa4py wheels; revisit 3.14 when supported.
# Freeze resolved packages after testing.
# This file is recommended for users with conda.
# Once the environment is activated, install frameit with:
#    pip install frameit

name: frameit_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - xarray
  - dask
  - numpy
  - scipy
  - cfgrib
  - eccodes
  - pyyaml
  - pyproj
  - xesmf
  - matplotlib
  - netcdf4
  - h5netcdf
  - h5py
  - threadpoolctl
  - pip
# For developpers : 
  - ruff
  - sphinx
  - sphinx_rtd_theme
  - furo
  - sphinx-autodoc-typehints
  - pip:
    - pytest
    # The wheel bundles ecCodes; isolate FA decoding from the conda GRIB reader.
    - falfilfa4py==1.3.0
