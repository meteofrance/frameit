# ==============================================
# Conda environment file for the FrameIt project
# ==============================================
#
# To create and activate the environment:
#
# 1. Create the environment:
#    conda env create -f environment.yaml
#
# 2. Activate it:
#    conda activate frameit_env
#
# 3. To update later:
#    conda env update -f environment.yaml --prune
#
# 4. To deactivate:
#    conda deactivate
#
# Procedure to recreate the env:
#    conda deactivate
#    conda env remove -n frameit_env
#    conda env create -f environment.yaml
#
# Python 3.13 qualifies the parent and isolated EPyGrAM FA helper.
# Keep the reference GRIB/ESMF parent separate from EPyGrAM's exact native pins:
#   python -m venv --system-site-packages build/fa-helper
#   build/fa-helper/bin/python -m pip install -e '.[fa]'
# Select build/fa-helper/bin/python with input.fa.python_executable (YAML-relative).
# See docs/source/user_guide/fa_epygram_c4.rst for qualification and runtime gaps.
# Freeze resolved packages after testing.
# This file is recommended for users with conda.
# Once the environment is activated, install frameit with:
#    pip install frameit

name: frameit_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - xarray
  - dask
  - numpy
  - scipy
  - cfgrib
  - eccodes
  - pyyaml
  - pyproj
  - xesmf
  - shapely>=2
  - matplotlib
  - netcdf4
  - h5netcdf
  - h5py
  - threadpoolctl
  - pip
# For developpers : 
  - ruff
  - sphinx
  - sphinx_rtd_theme
  - furo
  - sphinx-autodoc-typehints
  - pip:
    - pytest
