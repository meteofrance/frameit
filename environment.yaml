# ==============================================
# Conda environment file for the FrameIt project
# ==============================================
#
# To create and activate the environment:
#
# 1. Create the environment:
#    conda env create -f environment.yaml --solver libmamba
#
# 2. Activate it:
#    conda activate frameit_env
#
# 3. To deactivate:
#    conda deactivate
#
# Create a fresh environment when migrating an older mixed Conda/pip installation:
#    conda env create -f environment.yaml --solver libmamba -n frameit_unified
# FrameIt and its maintained FA extra are installed from this checkout below.
# One Python-3.13 environment supplies GRIB/NetCDF/ESMF and EPyGrAM. FA still runs
# in fresh isolated subprocesses using that Python; omit input.fa.python_executable.
# Conda owns the shared NetCDF/HDF5/ecCodes stack. Exact Python-package versions
# satisfy unmodified EPyGrAM 2.1.0 requirements, preventing pip replacements.
# Qualification uses Conda's resolved serial ESMF/shared NetCDF/HDF5 stack.
# See docs/source/user_guide/fa_environment.rst for qualification and migration.

name: frameit_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - xarray
  - dask-core
  - numpy
  - scipy
  - cfgrib
  - python-eccodes=2.44.0
  - pyyaml
  - pyproj
  - esmpy=8.9.1
  - xesmf=0.9.2
  - shapely>=2
  - matplotlib-base
  - netcdf4=1.7.2
  - h5netcdf
  - h5py
  - threadpoolctl
  - pip
  - pytest
  - setuptools>=77
  - wheel
  - pip:
      - -e .[test,grib,polar,fa]
      - ruff
      - sphinx==9.2.0
      - sphinx-rtd-theme
      - furo
      - sphinx-autodoc-typehints
