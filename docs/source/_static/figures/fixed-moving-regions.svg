<svg xmlns="http://www.w3.org/2000/svg" width="540" height="470" viewBox="0 0 540 470" role="img" aria-labelledby="title desc">
  <title id="title">Fixed and moving native crops</title>
  <desc id="desc">Schematic without grid lines, not to scale. A fixed crop stays at the same native point. A moving crop selects a new native point at each time. Hollow circles are requested geographical centres; solid dots are the selected native points. Crop outlines follow those native points.</desc>
  <g font-family="sans-serif" fill="#021633">
    <text x="24" y="35" font-size="24" font-weight="bold">Fixed region</text>
    <rect x="168" y="60" width="180" height="105" rx="3" fill="#f4f8f8" stroke="#006b65" stroke-width="3"/>
    <circle cx="258" cy="112" r="5"/>
    <circle cx="271" cy="102" r="8" fill="none" stroke="#9a4400" stroke-width="2"/>
    <text x="365" y="116" font-size="20">t₀ and t₁</text>
    <text x="24" y="205" font-size="24" font-weight="bold">Moving region</text>
    <rect x="45" y="230" width="180" height="105" rx="3" fill="#f4f8f8" stroke="#006b65" stroke-width="3" stroke-dasharray="7 4"/>
    <rect x="315" y="260" width="180" height="105" rx="3" fill="#f4f8f8" stroke="#006b65" stroke-width="3"/>
    <path d="M148 272C235 235 305 345 418 302" fill="none" stroke="#9a4400" stroke-width="2"/>
    <circle cx="135" cy="282" r="5"/><circle cx="405" cy="312" r="5"/>
    <circle cx="148" cy="272" r="8" fill="white" stroke="#9a4400" stroke-width="2"/>
    <circle cx="418" cy="302" r="8" fill="white" stroke="#9a4400" stroke-width="2"/>
    <text x="100" y="355" font-size="20">t₀</text><text x="390" y="390" font-size="20">t₁</text>
    <circle cx="30" cy="418" r="8" fill="none" stroke="#9a4400" stroke-width="2"/>
    <text x="48" y="424" font-size="18">Requested centre</text>
    <circle cx="290" cy="418" r="5"/>
    <text x="305" y="424" font-size="18">Selected native point</text>
    <text x="24" y="458" font-size="18">Crop locations and widths follow native indices.</text>
  </g>
</svg>
