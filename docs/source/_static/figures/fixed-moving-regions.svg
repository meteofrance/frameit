<svg xmlns="http://www.w3.org/2000/svg" width="540" height="470" viewBox="0 0 540 470" role="img" aria-labelledby="title desc">
  <title id="title">Fixed and moving native crops</title>
  <desc id="desc">Schematic, not to scale. Grid intersections mark native samples. A fixed crop stays at the same native point. A moving crop selects a new native point at each time. Hollow circles are requested geographical centres; solid dots are selected native points. Crop outlines follow native indices, not the continuous requested positions.</desc>
  <defs>
    <pattern id="native-grid" x="18" y="22" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a4afb8" stroke-width="1"/></pattern>
  </defs>
  <g font-family="sans-serif" fill="#021633">
    <text x="24" y="35" font-size="24" font-weight="bold">Fixed region</text>
    <rect x="24" y="42" width="330" height="140" fill="url(#native-grid)" stroke="#788997"/>
    <rect x="168" y="52" width="180" height="120" fill="#f4f8f8" fill-opacity=".5" stroke="#006b65" stroke-width="3"/>
    <circle cx="258" cy="112" r="5"/>
    <circle cx="271" cy="102" r="8" fill="none" stroke="#9a4400" stroke-width="2"/>
    <text x="365" y="116" font-size="20">t₀ and t₁</text>
    <text x="24" y="205" font-size="24" font-weight="bold">Moving region</text>
    <rect x="24" y="222" width="492" height="170" fill="url(#native-grid)" stroke="#788997"/>
    <rect x="48" y="232" width="180" height="120" fill="#f4f8f8" fill-opacity=".5" stroke="#006b65" stroke-width="3" stroke-dasharray="7 4"/>
    <rect x="318" y="262" width="180" height="120" fill="#f4f8f8" fill-opacity=".5" stroke="#006b65" stroke-width="3"/>
    <path d="M148 282C235 245 305 355 418 312" fill="none" stroke="#9a4400" stroke-width="2"/>
    <circle cx="138" cy="292" r="5"/><circle cx="408" cy="322" r="5"/>
    <circle cx="148" cy="282" r="8" fill="white" stroke="#9a4400" stroke-width="2"/>
    <circle cx="418" cy="312" r="8" fill="white" stroke="#9a4400" stroke-width="2"/>
    <text x="100" y="378" font-size="20">t₀</text><text x="390" y="405" font-size="20">t₁</text>
    <circle cx="30" cy="418" r="8" fill="none" stroke="#9a4400" stroke-width="2"/>
    <text x="48" y="424" font-size="18">Requested centre</text>
    <circle cx="290" cy="418" r="5"/>
    <text x="305" y="424" font-size="18">Selected native point</text>
    <text x="24" y="458" font-size="18">Crop locations and widths follow native indices.</text>
  </g>
</svg>
