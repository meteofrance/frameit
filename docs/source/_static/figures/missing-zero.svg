<svg xmlns="http://www.w3.org/2000/svg" width="540" height="340" viewBox="0 0 540 340" role="img" aria-labelledby="title desc">
  <title id="title">A missing sample is not physical zero</title>
  <desc id="desc">Three schematic samples: a measured zero with valid support, a NaN for missing source data, and an unmapped target with no source geometry. Values and quality indicators distinguish the cases. No missing sample is filled with a physical zero.</desc>
  <g font-family="sans-serif" fill="#021633">
    <rect x="20" y="20" width="500" height="74" rx="7" fill="#f4f8f8" stroke="#006b65" stroke-width="2"/>
    <text x="40" y="66" font-size="30" font-weight="bold">0</text>
    <text x="140" y="53" font-size="22">Valid value</text>
    <text x="140" y="80" font-size="18">Physical zero, supported sample</text>
    <rect x="20" y="110" width="500" height="74" rx="7" fill="#fff" stroke="#788997" stroke-dasharray="7 4" stroke-width="2"/>
    <text x="40" y="157" font-size="27" font-weight="bold">NaN</text>
    <text x="140" y="144" font-size="22">Missing source data</text>
    <text x="140" y="171" font-size="18">Read the field-specific mask</text>
    <rect x="20" y="200" width="500" height="74" rx="7" fill="#fff8f1" stroke="#9a4400" stroke-width="2"/>
    <path d="M45 222L77 254M77 222L45 254" stroke="#021633" stroke-width="3"/>
    <text x="140" y="234" font-size="22">Unmapped target</text>
    <text x="140" y="261" font-size="18">No source geometry at this point</text>
    <text x="20" y="317" font-size="18">Schematic · value, support and run completion are separate</text>
  </g>
</svg>
