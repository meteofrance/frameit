<svg xmlns="http://www.w3.org/2000/svg" width="540" height="580" viewBox="0 0 540 580" role="img" aria-labelledby="title desc">
  <title id="title">Location, basis and frame motion are separate</title>
  <desc id="desc">Schematic, not to scale. Native and polar positions differ. Collocation and rotation prepare components at chosen locations in an Earth basis. Subtracting moving-frame velocity is a different operation, not performed by moving a FrameIt window. Exported polar winds retain the Earth frame.</desc>
  <g font-family="sans-serif" fill="#021633">
    <rect x="12" y="12" width="516" height="164" rx="8" fill="#f4f8f8" stroke="#788997"/>
    <text x="28" y="43" font-size="23" font-weight="bold">1 · Choose sample locations</text>
    <path d="M35 65H185M35 95H185M35 125H185M55 60V145M95 60V145M135 60V145M175 60V145" fill="none" stroke="#788997"/>
    <circle cx="300" cy="105" r="43" fill="none" stroke="#006b65" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M300 57V153M252 105H348" stroke="#006b65"/>
    <text x="375" y="94" font-size="19">Polar points</text>
    <text x="375" y="122" font-size="19">r (km), θ (rad)</text>
    <text x="35" y="161" font-size="18">Native grid</text>
    <rect x="12" y="190" width="516" height="164" rx="8" fill="#fff" stroke="#788997"/>
    <text x="28" y="222" font-size="23" font-weight="bold">2 · Express the vector basis</text>
    <path d="M60 320L120 255M60 320L150 320" fill="none" stroke="#006b65" stroke-width="3"/>
    <text x="130" y="260" font-size="19">grid x</text>
    <text x="155" y="327" font-size="19">east</text>
    <text x="265" y="269" font-size="19">Collocate, then rotate</text>
    <text x="265" y="300" font-size="19">Check actual coordinates</text>
    <text x="265" y="331" font-size="19">Velocity units: m s⁻¹</text>
    <rect x="12" y="368" width="516" height="198" rx="8" fill="#fff8f1" stroke="#9a4400" stroke-dasharray="8 4"/>
    <text x="28" y="402" font-size="23" font-weight="bold">3 · Change the moving frame?</text>
    <text x="28" y="444" font-size="21">v(relative) = v(Earth) − v(frame)</text>
    <text x="28" y="482" font-size="19">Separate downstream scientific choice.</text>
    <text x="28" y="518" font-size="19">Exported polar winds keep the Earth frame.</text>
    <text x="28" y="549" font-size="18">Schematic · no implied flow or conservation</text>
  </g>
</svg>
