# Reference only: alternatives appear together, not a runnable starter.
# Sizes, fields, positions and declarations below are instructional examples.
# Omit optional controls for defaults; explicit null is invalid outside metadata.extra.
schema_version: 3
run:
  name: analysis
  description: ""
sources:
  atmosphere:
    model: arome                  # arome | mesonh | nemo | croco; omit only for reliable detection.
    format: fa                    # netcdf | grib | fa; must agree with input evidence.
    files: [./data/input.fa]       # Path, glob, or list of paths/globs, relative to this YAML.
    exclude: []                   # Explicit path/glob exclusions; no provider-priority option.
    profile: arome_history        # FA only: arome_history | surfex_history.
    time:
      cycle: "2026-01-01T00:00:00" # Exact forecast reference time when cycles compete.
      start: "2026-01-01T00:00:00" # Inclusive bounds; source calendar is retained.
      end: "2026-01-02T00:00:00"
      stride: 2                   # Every Nth available record after the window.
      # Instead of start/end/stride: values: ["2026-01-01T00:00:00"]
    variables:
      2d: [sample_field]          # No selectable vertical axis; time is not a spatial axis.
      3d: [sample_cube]           # Retain a vertical axis even for one selected level.
      # Alternative: 3d: {level: {names: [sample_cube], levels: {indices: [0]}}}
      # With grouped 3d, omit variables.levels and refer to level.sample_cube.
      levels:
        indices: [0]             # Original zero-based positions, in explicit list order.
        # Or indices: {start: 0, end: 20, step: 2}, inclusive.
        # Or values: [850, 700], values: {min: 700, max: 850}, or domain: physical.
        # Optional units: hPa; compatible coordinate conversion, not field conversion.
    field_metadata:              # Describe stored values; do not request conversions.
      sample_field:
        units: K
        kind: continuous         # continuous | categorical; no name-based inference.
        temporal_kind: instantaneous
        allow_unscaled: false    # FA only; true needs producer-specific justification.
        long_name: Example temperature
        standard_name: air_temperature # Only when the quantity matches the CF definition.
      sample_cube:
        units: K
        kind: continuous
        temporal_kind: instantaneous
    native_cubes:                # FA only; exact record associations do not establish height.
      sample_cube:
        records: [S001TEMPERATURE, S002TEMPERATURE]
        vertical_position: mass  # mass | interface.
        sampling: center         # Only admitted centre sampling.
        # Wind cubes may declare vector_basis: earth | grid and
        # component_scaling: physical_velocity, within the admitted FA contract.
    fa:
      subdomain: CI              # CI | C; exclude spectral extension zones.
      earth_radius_m: 6371229.0  # Example only: use independently evidenced source geometry.
      expected_source:          # Exact assertions, never replacement producer metadata.
        PROGRAM: REPLACE_FROM_HEADER
        VERSION: 0
        BUG: 0
        MASDEV: 0
        BUGFIX: 0
    reader:
      python_executable: ./environment/bin/python # Optional FA helper; symlinks are preserved.
      timeout_seconds: 120.0
      max_points: 20000000       # Full-record decode guard, not a memory ceiling.
      # NetCDF instead: engine: h5netcdf | netcdf4 | scipy
      # NetCDF input chunks: {time: 1}; native dimension names, positive counts or -1.
    # For eligible Meso-NH NetCDF fields only: interpretation: mesonh_surfex_sea
    # For wind operations, using actual source names and evidenced basis:
    # wind_pairs:
    #   - {u: UT, v: VT, basis: grid, rotation: {method: mesonh_projection}}
    # rotation alternatives: {method: geolocation} or
    # {method: coordinate, coordinate: grid_rotation}; projection BETA/RPK/LON0
    # need evidence. A declaration alone does not rotate exported fields.
    # transforms:
    #   - {fields: [UT, VT], sampling: mass, basis: earth, units: "m s-1"}
    #   - {fields: [WT], sampling: mass}
    # derived:
    #   speed: {method: wind_speed, inputs: {u: UT, v: VT}}
region:
  tracker:
    method: pressure_wind
    search_width_km: 200.0       # Full square width; default 200 km.
    refine_width_km: 100.0       # Full square width; default 100 km.
    on_incomplete: error         # Default error; keep_prefix only for supported methods.
    initial_guess:              # Optional first-time circular search.
      latitude: -20.0
      longitude: 60.0
      search_radius_km: 100.0
    # Alternative method: pressure_centroid, with settings directly under tracker:
    # convergence: {max_iterations: 15, tolerance_m: 250.0}
    # motion: {max_iterations: 50, solver: aitken, relaxation: 0.25, tolerance_m: 250.0}
    # sampling: {r80_max_distance_km: 250.0, radial_step_km: 2.5, azimuth_step_deg: 5.0}
    # Alternative experimental method: multifield_vortex:
    # profile: all_no_thick
    # seed: {latitude: -20.0, longitude: 60.0, time: "2026-01-01T00:00:00",
    #        motion_u_m_s: 0.0, motion_v_m_s: 0.0}
    # mnh_gravity_m_s2: 9.80665  # Only with independently evidenced MNH gravity.
    # numerics: {analysis_step_km: 25.0, refinement_km: 2.5, max_iterations: 20,
    #            minimum_support: 0.8, minimum_samples: 16}
    # quality: {minimum_parameters: 2, pressure_rise_pa: 50.0, vt850_min_m_s: 1.5,
    #           max_separation_km: 425.0, max_speed_m_s: 30.866666666666667,
    #           speed_check_interval_hours: 6.0}
    # Alternative method: utrack; obtained weights/dependencies are required:
    # weights_file: ./model.ckpt
    # use_gpu: false
    # batch_size: 16
  # Instead of tracker, use center: {latitude: -20.0, longitude: 60.0}
  # or track: {file: ./track.nc}. These three providers are mutually exclusive.
  sources_coupling_time_association: exact # exact | common | admitted preceding_hour.
  width_km: {x: 400.0, y: 400.0} # Full widths along native grid directions.
products:
  model_grid:
    fields: {atmosphere: [sample_field, sample_cube]} # Optional exact subsets by source.
    processing:
      chunks: {}                 # Computation chunks, not input or storage chunks.
  polar:
    radius_km: 200.0             # Required; independent of the model-grid crop.
    radial_step_km: 5.0          # Example, not default; cannot be finer than supported native spacing.
    azimuth_count: 180           # Omit for automatic outer-ring spacing.
    shared_grid: false           # Common target is opt-in; masks/vertical axes remain distinct.
    fields: {atmosphere: [sample_field, sample_cube]}
    missing_data_policy: strict  # strict | renormalize.
    # renormalize also requires an explicit min_valid_weight_fraction.
    field_options:
      atmosphere:
        sample_field:
          interpolation: bilinear # bilinear | nearest; kind needs source evidence.
          missing_data_policy: strict
          # sampling: native | mass, only where admitted.
    processing:
      chunks: {}                 # Exported polar dimensions; positive integers or -1.
      max_target_points: 2000000 # Geometry guard, not a whole-run memory limit.
      plan_cache: {entries: 8, max_bytes: 134217728}
      source_halo_points: 1      # Must support the selected method; never extrapolate.
      weight_zero_tolerance: 1.0e-14 # Numerical stencil-weight tolerance, not a field cutoff.
      profile: false             # Performance measurements, not extra diagnostics.
  track: true                    # Reusable NetCDF trajectory; never implied by a centre provider.
output:
  directory: ./output            # YAML-relative run root.
  format: netcdf                 # netcdf | zarr; one field format per run.
  overwrite: false               # Default false; source inputs remain protected.
  writer:
    engine: netcdf4              # NetCDF only: netcdf4 | h5netcdf.
    unlimited_time: true         # NetCDF only; no append/resume promise.
    compression:
      level: 1                   # Default 1, lossless; integer 0..9.
      coordinates: false         # Default false.
    chunks: {}                   # Storage chunks use exported dimensions and element counts.
    # Zarr only: shards: {time: 8, radius: 64, azimuth: 180}
resources:
  cpus: 4                        # Example budget; omission uses allocation/affinity limits.
  scheduler: threads             # threads | synchronous.
  compute_workers: 2             # Omit for automatic workers within the CPU budget.
  export_workers: 1              # Omit for automatic workers within the same budget.
  native_threads: 1              # Default 1; nested pools cannot multiply the CPU budget.
  synchronous_export: false      # Default false; true writes in the controlling process.
logging:
  level: INFO                    # DEBUG | INFO | WARNING | ERROR.
metadata:
  institution: Example institute # Optional; no institutional default.
  extra: {}                      # Arbitrary annotations cannot override generated provenance.
