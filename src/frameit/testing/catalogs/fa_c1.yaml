primary_target: EPyGrAM SURFEX FA coupled to AROME GRIB on independent native grids
scientific_approval: not established
default_backend: native
effective_backend_provenance: backend_versions.FA_backend
dependency_extra: 'fa-epygram: epygram==2.1.0, ctypesForFortran==1.3.0'
dependency_policy: unmodified upstream requirements; no forced overrides or installed-package edits
retired_responsibilities:
  - duplicate raw FA open/full _inspect prepass in EPyGrAM transactions
retained_exceptions:
  - same-resource index count/length/duplicate observations; library omits headers and lengths
  - selected native FANION errors; no generic metadata fallback for physical failures
  - named structural L0 0/1 and mixed T0 words; library loses these facts
  - original-header adapter and raw-clock consistency observation until C2 contract transfer
transaction_counts:
  opens: 1
  closes: 1
  header_inquiries: 2
  header_clock_inquiries: 2
  metadata_physical_decodes: 0
  selected_data_decodes: 1
admitted_surface:
  source: {PROGRAM: AROME, VERSION: 8, BUG: 1, MASDEV: 47, BUGFIX: 0}
  surfex_pack: 0
  type: X1
  dim1: native storage X*Y
  dim2: -1
  ci_checks: IMAX/JMAX match native CI; DIM_FULL equals IMAX*JMAX, not necessarily storage size
  state_clock: required DTCUR equals header validity; finite mixed date/IEEE-seconds
  scientific_meaning: explicit field declarations; no units/time/basis inference from library tables
  masks: native undefined to NaN; dense IEEE NaNs/valid zeros/support labels remain distinct
  scaling: native diagnostic guard; missing is fatal by default; no warning is not identity proof
compact_evidence:
  shape_y_x: [7, 9]
  geometries: [regular_lonlat, spherical_tangent_lambert_south]
  truth: 280 + 10*j + i; NaN at [1,1], physical zero at [2,2]
  comparison: exact values and masks; independently prescribed, not same-library reread truth
  operations: [inventory, selected_metadata, typed_structure, selected_decode, lazy_dataset, native_export]
  physical_fa_packing: 0
  native_scaling_failure_fixture: FA packing 120, SURFEX PACK=0; actual FMULTM/FMULTE warning
  ordinary_readers: fresh xarray/NetCDF readers without FrameIt/EPyGrAM
  source_policy: generated fixtures read-only; source bytes unchanged
  ci_vs_storage_case: CI 5*7 (DIM_FULL=35), storage 7*9 (X1 DIM1=63); full-native budget enforced
  undefined_observation: EPyGrAM returned mask; original native flag/sentinel not exposed
  packing120_missing_value: returned NaN without a mask bit; valid zero retained
families:
  dense_surfex_pack0_x1: qualified compact selected decode/native export; explicit eligible polar regression
  surfex_structure_c0_n0_x0_n1: limited to named evidenced structure; exact bytes/types/shapes
  surfex_structure_l0_t0: narrow same-resource observations required and tested
  real_priority_sfx_fields: blocked pending producer scaling/units/time/support/Earth-model references
  packed_support_maps_x2_physical_n1_l1_c1: blocked; independent type/map/order/value evidence required
  layer_patch_tile_axes: blocked; individually declared dense 2-D record names only
  atmospheric_gridpoint_cubes: existing P5 contracts retained; full/interface indices and PREFER/A/B
  atmospheric_minus91_spectral: blocked; no fallback or implicit transform
  intervals_static_physical_coordinates: blocked; no automatic diagnosis or conversion
  grib_implementation: existing cfgrib/ecCodes baseline; isolated parity step prerequisite to change
  grib_epygram_surfex_multitime_pair: C3 qualification prerequisite; not certified by C1 component tests
