# Engineering qualification/provenance, not a producer preset or scientific approval.
schema_version: 1
stage: C2
checked_on: '2026-10-27'
starting_revision: 6a7e161
scientific_approval: not established
primary_target: EPyGrAM SURFEX FA coupled to AROME GRIB on independent native grids
families:
  modern_regular_lonlat_ci: qualified compact ascending/descending angular axes; Earth model not inferred
  spherical_tangent_lambert_ci_c: qualified compact both hemispheres; offset CI/CIE and nonzero I zones
  dense_surfex_pack0_x1: C1 selected decode/mask/scaling contracts retained with library-labelled geometry
  atmospheric_gridpoint_cubes: P5 explicit full/interface labels/indices and normalized A/B/PREFER retained
  grib_netcdf: existing cfgrib/ecCodes loader retained; isolated EPyGrAM metadata and independent output comparison
  real_producer_fields: unresolved units/scaling/time/support/Earth-model/vertical/vector evidence
  grib_epygram_surfex_multitime_products: C3 gate; single-time dry-run is planning only
  unsupported: [additional_projections, global_reduced_grids, packed_support_maps, physical_typed_arrays,
                layer_patch_tile_axes, intervals_static, spectral_execution, physical_vertical_diagnosis]
transferred_responsibilities:
  geometry: library dimensions/gimme_corners_ij/ij2xy/ij2ll/projection/CRS to labelled axes and native indices
  canonical_origin: library CI-centred CRS translated to existing CF tangent-latitude origin; no fit
  selection: direct selected H2D metadata accessor; redundant library field_type dispatch removed
  hybrid: one library vcoordinate contract per transaction; no parent header reconstruction
  identity: library axes/CRS/zones signature; shape alone is insufficient; vertical facts separate
retained_exceptions:
  original_header: admission flags, encoded CI corners, original normalized A/count; same-resource inquiry only
  private_library_apis: _proj.crs, _readH2DField and allowlisted _readMiscField; version-matched fail-closed API
  native_errors: selected FANION -91/-93/-94 cannot fall back to Misc
  index: same-unit bounded length/count/duplicate observations; library omissions
  structure: named L0 0/1 and mixed T0 observations; physical words never use this path
  clock: raw consistency observation; no permissive timestamp substitution
  scaling: native diagnostic text; no structured qualified multiplier query
  cube_assembly: explicit record/Dask axis adapter; CombineLevels generic grouping/resource handles do not fit
  grib: preflight coverage/geometry plus loader selection/grouping/laziness; no qualified simpler isolated replacement
  legacy_native: explicit compatibility baseline until C3/C4; never an EPyGrAM fallback
transaction_counts:
  opens: 1
  closes: 1
  header_inquiries: 2
  header_clock_inquiries: 2
  selected_fanion_inspect: 2
  selected_fanion_read: 3
  metadata_physical_decodes: 0
  selected_data_decodes: 1
  geometry_transfer: O(nx+ny) axes plus CRS/zones; no full geographic JSON arrays
independent_evidence:
  geometry: Snyder equations; off-origin anchor, offset CI, C/I/E, both hemispheres
  axis_tolerance_m: 1.0e-7
  inverse_equation_tolerance_degrees: 2.0e-11
  regular_axis_tolerance_degrees: 1.0e-10
  encoded_corner_bound_degrees: 2.0e-5
  existing_tolerances: unchanged
  fields: independent columns/masks/valid zeros; sparse/reordered full/interface indices and original IDs
  vectors: companions/neighbours before selection; native/analysis branches and idempotent preparation
  grib: prescribed 700/850 hPa, cycle/time/units and 5-by-7 values; library field level 85000 Pa remains distinct
  ordinary_readers: fresh NetCDF readers import neither FrameIt nor EPyGrAM
  sources: compact generated fixtures read-only; no new private corpus or large run/download/upload
compatibility:
  yaml_defaults_extras: unchanged; explicit backend/helper and scientific declarations preserved
  schema: existing scientific NetCDF names/dimensions/precision/compression/masks retained
  provenance_additions: geometry_contract; fa_geometry_origin; fa_earth_model_origin
  signature: horizontal_header_signature key retained; EPyGrAM value is now library-derived JSON
  earth_model: projected radius explicitly declared; angular grid does not adopt library default geoid
  sampling: common exact times/warnings/full exclusions; strict selectable; optional bilinear continuous polar
  physical_operations: no new diagnostic, pressure/height, wind basis, extrapolation or missing-to-zero policy
