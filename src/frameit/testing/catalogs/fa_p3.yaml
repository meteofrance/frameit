priority_inputs:
  - priority: 1
    quantity: mean sea level pressure
    record: GRIB prmsl / meanSea
    native_units: Pa
    temporal_support: instant at valid time
    status: observed metadata; existing GRIB path, not a new independent physical validation
  - priority: 1
    quantity: near-surface horizontal winds
    record: GRIB 10u, 10v / heightAboveGround=10
    native_units: m s**-1
    vector_flag: uvRelativeToGrid=0
    temporal_support: instant at valid time
    status: observed metadata; preserve Earth-relative definition
  - priority: 1
    quantity: pressure-level winds, temperature, relative humidity, geopotential
    record: GRIB u, v, t, r, z / isobaricInhPa
    selected_levels_available_hPa: [850, 700, 500]
    native_units: {u: m s**-1, v: m s**-1, t: K, r: '%', z: m**2 s**-2}
    temporal_support: instant at valid time
    status: observed metadata; no inferred physical vertical conversion
  - priority: 2
    quantity: near-surface temperature and relative humidity
    record: GRIB 2t, 2r / heightAboveGround=2
    native_units: {2t: K, 2r: '%'}
    temporal_support: instant at valid time
    status: observed metadata; RH is not specific humidity
  - priority: 1
    quantity: requested surface SST / near-surface temperature / humidity / radiative state
    records: [SFX.SST, SFX.T2M, SFX.HU2M, SFX.TSRAD]
    support_labels: {SFX.SST: SEA, SFX.T2M: FULL, SFX.HU2M: FULL, SFX.TSRAD: FULL}
    native_encoding: gridpoint, packing=120, bits=24
    status: metadata observed; physical units/scaling/time definitions need release-matched evidence
  - priority: 3
    quantity: selected native soil layer / patch states
    records: [SFX.TG1P1, SFX.WG1P1]
    support_labels: NATURE
    native_encoding: dense gridpoint, packing=120, bits=24
    status: individually named 2-D records only; no inferred depth, patch axis or averaging
  - priority: 3
    quantity: latent/sensible surface heat exchange and radiation
    records: [slhf, sshf, ssrd, strd]
    native_units: J m**-2
    temporal_support: GRIB accum, hours 0-12
    status: accumulated energy metadata observed; not W m-2, no automatic rate or sign conversion
  - priority: 3
    quantity: rain amount
    record: GRIB tirf, Time integral of rain flux
    native_units: kg m**-2
    temporal_support: GRIB accum, hours 0-12
    status: metadata observed; no automatic deaccumulation or diagnostic selection
  - priority: 3
    quantity: surface turbulent stresses
    records: [iews, inss]
    native_units: N m**-2
    temporal_support: GRIB stepType=accum, hours 0-12
    status: blocked interpretation; native names say instantaneous but temporal keys say accumulated
not_found_under_requested_exact_sfx_ids: [SFX.H, SFX.LE, SFX.FMU, SFX.FMV, SFX.RAIN]
required_gaps:
  - release-matched units/scaling/temporal definitions and trusted decodes for real SFX records
  - producer Earth model and independent real geographic checkpoints
  - multi-time real corpus and interval/reset references
  - packed maps, X2 layouts, typed physical arrays and independent layer/tile definitions
  - native atmospheric -91/spectral/3-D contracts remain separate P0/P4/P5 gates
outside_current_phase:
  - other atmospheric producers and new native-container adapters
  - global/reduced FA processing
  - CROCO/WW3 adapters; generic NetCDF fixtures test orchestration only
synthetic_qualification:
  - paired native AROME FA / SURFEX FA with different projected spacings and source indices
  - effective 54-point shared target under a 60-point per-source budget; genuine excess still rejected
  - moving two-time target on three independent NetCDF grids
  - separate synchronous/spawn exports and ordinary-reader coordinate/value/mask checks
  - dense multi-field FA, reordered directory, SEA/NATURE labels, IEEE NaNs and valid zeros
  - one original layer/patch record selected without other physical decodes
  - independent dense full/point/strided/reversed truth; no sparse support-map admission
  - categorical X1 codes/NaNs/zeros, ordinary-reader units/type and explicit nearest_s2d gate
  - missing directory/source records remain inspectable but cannot bypass either execution profile
  - inconsistent dense dimensions and X0/X2/N1/L1/C1 physical layouts remain blocked
  - raw native vertical headers retained; atmospheric cubes and vertical selectors remain gated
  - conflicting target settings, actual-coordinate mismatch and disabled-polar/no-FA cases
  - unqualified producer/PACK/X2 rows fail without weakening reader gates
