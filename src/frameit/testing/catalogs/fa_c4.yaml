    conda run --no-capture-output -n frameit_env build/p5-epygram-env/bin/python -m pytest -q
    src/frameit/testing/numerical/test_fa_*.py src/frameit/testing/numerical/test_arome_fa_coupling.py
    src/frameit/testing/numerical/test_coupled_shared_polar.py
    --basetemp build/c4-native-focused --junitxml=build/c4-native-focused.xml
