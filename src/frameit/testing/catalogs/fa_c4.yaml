  native_cubes: native alias sync/spawn exports retain independent coefficients, IDs, masks and sparse levels
  output_contract: scientific names/dimensions/units/masks/source-groups/encoding preserved
  provenance_changes: requested/effective backend and migration, library geometry signature/origins, returned-mask origin
  warnings: schema validation and requests explain alias and canonical extra
  alternate_decoder_fallback: absent
  scientific_defaults: explicit declarations and all unsupported/scaling/error/resource gates retained
