default_backend: epygram
legacy_backend: 'native: warned deprecated alias; requested spelling replayed, effective epygram recorded'
installation: fa canonical; fa-epygram compatibility alias with identical dependencies
cleanup_ledger: docs/source/user_guide/fa_epygram_c4.rst
qualified_families:
