  baseline_reference_helper: FRAMEIT_TEST_EPYGRAM_PYTHON=$PWD/build/p5-epygram-env/bin/python
  baseline_reference: conda run --no-capture-output -n frameit_env python -m pytest -q --basetemp build/c4-baseline-reference --junitxml=build/c4-baseline-reference.xml
  baseline_epygram: conda run --no-capture-output -n frameit_env build/p5-epygram-env/bin/python -m pytest -q --basetemp build/c4-baseline-epygram --junitxml=build/c4-baseline-epygram.xml
