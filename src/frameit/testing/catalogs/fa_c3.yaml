# Engineering evidence, not a producer preset, scientific approval or universal FA support.
schema_version: 1
stage: C3
checked_on: '2026-10-27'
starting_revision: 8b6f438
primary_target: AROME-convention GRIB atmosphere plus EPyGrAM-decoded SURFEX FA on independent grids
scientific_approval: not established
families:
  grib_atmosphere: real GRIB2 containers, Météo-France centre, instantaneous surface and pressure groups
  surfex_fa: evidenced AROME-47 / SURFEX-8.1 dense PACK=0/X1; independently written analytical fixture
  primary_pair: qualified compact multi-time native and explicitly shared bilinear scalar products
  compatibility: existing FA/FA, NetCDF, no-FA, source conflicts, native cubes, vectors and failure/resource cases
  real_producer_fields: unresolved release-matched scaling/units/time/support/Earth-model evidence
  unsupported: [packed_support_maps, physical_typed_arrays, layer_patch_tile_axes, interval_conversions,
                static_surface_products, spectral_execution, physical_vertical_diagnosis]
fixture:
  atmosphere_shape_y_x: [13, 15]
  atmosphere_spacing: inferred 999.219545692687 m from prescribed angular coordinates
  surfex_shape_y_x: [9, 11]
  surfex_spacing_m: 3000.0
  surfex_earth_radius_m: 6371229.0
  reference_time: '2026-01-01T00:00:00'
  atmosphere_valid_hours: [0, 1, 2]
  surfex_valid_hours: [1, 2, 3]
  selected_hours: [1, 2]
  input_order: deliberately unordered
  atmospheric_native_quantities: [prmsl, u10, v10, u, v, t, r, z]
  atmospheric_levels_hpa: {stored: [700, 850], selected: [850]}
  atmospheric_vectors: explicit Earth-relative declaration checked against encoded uvRelativeToGrid=0
  surface_native_names: [SFX.T2M, SFX.SST]
  surface_support_labels: {SFX.T2M: FULL, SFX.SST: SEA}
  unselected_surface_record: logical L0 directory entry; never selected as a physical payload
  data: independently prescribed affine pressure/columns, GRIB bitmap NaN, SST NaN and stored T2M/u10 zeroes
  source_policy: generated read-only fixtures; input bytes unchanged; size/mtime freshness is not a checksum
  scaling: no allow_unscaled opt-in; native absence-of-warning is not identity-scaling evidence
  moving_centres_lon_lat: [[50.0, -20.0], [50.015, -19.988]]
  atmospheric_indices_i_j: [[7, 6], [9, 7]]
  surfex_indices_i_j: [[5, 4], [6, 4]]
  products: [atmosphere.surface, atmosphere.isobaricInhPa, surfex.surface]
  cartesian_winds: explicitly native; original component names/values; no magnitude export
  polar_scalars: {atmosphere: [prmsl, t, r, z], surfex: [SFX.T2M, SFX.SST]}
  derivations: no unselected wind diagnostic, physical vertical coordinates, height, pressure or interval conversion
shared_target:
  enabled: explicitly selected; disabled case forbids target construction
  planning_order: both native geometries, then shared sampling, then actual allocation budget
  radial_step_origin: coarsest_participating_native_grid
  radial_step_m: 3000.0
  radii_km: [0.0, 3.0, 4.0]
  azimuth_count: 9
  common_time_count: 2
  allocated_points_per_source: 54
  accepted_limit: 60
  rejected_limit: 53
  full_native_fa_points: 99
  rejected_full_native_limit: 98
  interpolation: continuous production bilinear; strict missing-data policy; no conservation claim
  coordinate_verification: exact time/radius/azimuth/longitude/latitude/continuous-centre equality across sources/groups
backend_evidence:
  observations: sources.surfex.fa_decoder.payload_reads; individual requests in decoder JSONL
  library: EPyGrAM
  actual_resource_class: epygram.formats.FA.FA
  selected_accessor: _readH2DField(getdata=True)
  openmode: r
  instrumented_test: production worker observes actual library H2D calls and native open/close/decode counts
  metadata_only: zero physical decodes; no payload_read observation
  native_baseline: same additive observation identifies falfilfa4py FA.wfacilo after the actual call
  isolation: fresh FA-only helper; no Python GRIB/ecTrans module in gridpoint worker, no FA runtime in GRIB parent
  grib_decision: C2 evaluation retained cfgrib/ecCodes; no qualified simpler lazy/grouped isolated replacement
independent_verification:
  ordinary_readers: fresh explicit xarray/NetCDF4 process, no FrameIt/EPyGrAM/FA/GRIB imports
  exports: synchronous and spawn; separate native and polar source/vertical-qualified products
  native_arrays: exact prescribed formulae/NaNs/zeroes and retained original names/units
  polar_pressure: independent affine lon/lat solution at both continuous centres, exact float32 export rounding
  polar_temperatures_absolute_tolerance: 1.0e-9
  coordinate_comparison: exact equality
  metadata: source IDs/groups, units, native names, support labels, numeric/string/uint8 flag attributes
  exclusions: full per-source times/files/counts/missing times in provenance/status, including >10-warning-preview case
  failures: [strict_time_sets, coupled_cycle_disagreement, mixed_source_cycles, surface_clock_conflict,
             expected_source_conflict, missing_native_scaling, target_budget, finer_target, full_native_budget]
  replay: resolved coupled YAML retains effective backend/helper, selections and disabled scaling fallback
compatibility:
  existing_yaml_defaults_extras: unchanged
  output_schema: existing native/source/vertical-qualified names/dimensions/precision/compression retained
  provenance: additive payload_read transaction observation and consolidated payload_reads
  example_migration: cyclone example declares wind pairs, supplied moving track, native Cartesian winds and selected scalar polar fields
  library_defaults: not producer-specific scientific proof
  legacy_retirement: none in C3; C4 requires full regression parity and explicit migration
