# Paths are relative to this YAML. Adapt the inspected fields and geometry.
schema_version: "2.1"
model: mesonh
run:
  name: mesonh-pressure-wind
input:
  directory: ./data
  pattern: "*.nc"
  format: netcdf
  # Exclude the exact 000 timeseries filename via input.exclude when needed.
  # Verify the source wind basis of UM10/VM10, pressure and velocity units.
  # earth: u positive eastward, v positive northward; no storm motion subtracted.
  wind_pairs:
    - {group: fields_2d, u: UM10, v: VM10, reference_frame: earth}
tracking:
  method: pressure_wind
domain:
  # Illustrative full widths in km, NOT tracker search half-widths.
  width_km: {x: 500, y: 500}
variables:
  fields_2d:
    names: [UM10, VM10, MSLP]
polar:
  # No polar sampling or embedded SURFEX interpretation is selected.
  enabled: false
output:
  directory: ./output
  overwrite: false
  cartesian:
    horizontal_vectors: earth_centered
