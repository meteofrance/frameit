schema_version: 2
model: mesonh
run:
  name: analysis
input:
  directory: ./data
  pattern: "*.nc"
  # UM10/VM10 are declared Earth-relative; adapt this to your source diagnostics.
  wind_pairs:
    - {group: surface, u: UM10, v: VM10, reference_frame: earth}
tracking:
  method: wind_pressure
domain:
  size_km: {x: 500, y: 500}
variables:
  surface:
    names: [UM10, VM10, MSLP]
polar:
  enabled: false
  variables: all
output:
  directory: ./output
  engine: netcdf4  # Or zarr (optional extra); see output documentation for chunks vs shards.
  # zarr_chunk_size: {time: 1, y_box: 128, x_box: 128}
  # zarr_shard_size: {time: 8, y_box: 512, x_box: 512}
  cartesian: {horizontal_winds: mass_earth, vertical_velocity: interfaces}
  polar: {vertical_velocity: mass}
