schema_version: "2.1"
model: mesonh
run:
  name: analysis
input:
  directory: ./data
  pattern: "*.nc"
  # Optional embedded SEA interpretation; also select these names under variables.
  # netcdf: {surfex_fields: [SST, SSS, H_SEA, LE_SEA, FMU_SEA, FMV_SEA]}
  # UM10/VM10 are declared Earth-relative; adapt this to your source diagnostics.
  wind_pairs:
    - {group: surface, u: UM10, v: VM10, reference_frame: earth}
tracking:
  method: pressure_wind
domain:
  width_km: {x: 500, y: 500}
variables:
  surface:
    names: [UM10, VM10, MSLP]
polar:
  enabled: false
  variables: extracted
output:
  directory: ./output
  backend: netcdf4  # Or zarr (optional extra); see output documentation for chunks vs shards.
  # zarr_chunk_size: {time: 1, y_box: 128, x_box: 128}
  # zarr_shard_size: {time: 8, y_box: 512, x_box: 512}
  cartesian: {horizontal_vectors: earth_centered, vertical_velocity: interfaces}
  polar: {vertical_velocity: mass}
