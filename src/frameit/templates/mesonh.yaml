# Paths are relative to this YAML. Adapt the inspected fields and geometry.
schema_version: 3
run:
  name: mesonh-pressure-wind
sources:
  atmosphere:
    model: mesonh
    files: "./data/*.nc"
    format: netcdf
    variables:
      2d: [UM10, VM10, MSLP]
    # Exclude the exact 000 timeseries filename via sources.atmosphere.exclude when needed.
    # Verify the source wind basis of UM10/VM10, pressure and velocity units.
    # earth: u positive eastward, v positive northward; no storm motion subtracted.
    # Not auto-detected: confirm this declaration from source metadata or producer docs.
    wind_pairs:
      - {u: UM10, v: VM10, basis: earth}
    # Preserve the selected Earth-relative, mass-point output representation.
    transforms:
      - {fields: [UM10, VM10], sampling: mass, basis: earth}
region:
  tracker:
    method: pressure_wind
  # Illustrative full widths in km, NOT tracker search half-widths.
  width_km: {x: 500, y: 500}
products:
  # No polar sampling or embedded SURFEX interpretation is selected.
  model_grid: true
# Post-run diagnostics are off unless explicitly requested.
# diagnostics: {}
output:
  directory: ./output
  overwrite: false
