# Paths are relative to this YAML.
# Instructional AROME NetCDF layout, not an AROME producer file or physical simulation.
schema_version: 3
run:
  name: arome-fixed-scalar
sources:
  atmosphere:
    model: arome
    files: ./data/first-run.nc
    format: netcdf
    variables:
      # Dimensionless instructional scalar: valid zero is distinct from missing (NaN).
      2d: [instructional_scalar]
region:
  # Geographic degrees north/east; replace with an inspected point for real data.
  center: {latitude: -20., longitude: 60.}
  # Full widths in km; omit for a full native copy without using the centre.
  width_km: {x: 4, y: 4}
products:
  # No wind declarations, optional diagnostics or polar sampling are needed.
  model_grid: true
output:
  directory: ./output
  overwrite: false
