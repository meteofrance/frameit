schema_version: 2
model: arome
run:
  name: analysis
input:
  directory: ./data
  pattern: "*.grib"
  # Explicit source convention for the standard requested surface winds.
  wind_pairs:
    - {group: surface, u: u10, v: v10, reference_frame: earth}
tracking:
  method: wind_pressure
domain:
  size_km: {x: 500, y: 500}
variables:
  surface:
    names: [u10, v10, prmsl]
polar:
  enabled: false
  variables: all
output:
  directory: ./output
  engine: netcdf4  # Or zarr (optional extra); see output documentation for chunks vs shards.
  # zarr_chunk_size: {time: 1, y_box: 128, x_box: 128}
  # zarr_shard_size: {time: 8, y_box: 512, x_box: 512}
  cartesian: {horizontal_winds: mass_earth, vertical_velocity: interfaces}
  polar: {vertical_velocity: mass}
