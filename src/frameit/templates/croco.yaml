schema_version: "2.1"
model: croco
input:
  directory: ./data
  pattern: '*.nc'
  format: netcdf
variables:
  s_rho:
    names: [temp, salt]
    levels: {indices: [0]}
  surface:
    names: [zeta]
tracking:
  method: fixed_box
  fixed_box:
    center: {latitude: -20., longitude: 60.}
output:
  directory: ./output
  overwrite: false
  cartesian: {horizontal_vectors: native}
