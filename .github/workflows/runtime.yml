name: Batch runtime

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core-batch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test dependencies (no GRIB or ESMF)
        run: python -m pip install -e '.[test]'
      - name: Check core-only dependency boundary
        run: |
          python -m pip check
          python -c "import importlib.util as u; assert all(u.find_spec(n) is None for n in ('epygram', 'falfilfa4py', 'ectrans4py', 'eccodes', 'cfgrib', 'xesmf', 'ESMF'))"
      - name: Exercise batch CLI, export and failure lifecycle
        run: >-
          python -m pytest -q
          src/frameit/testing/numerical/test_hpc_execution.py
          src/frameit/testing/numerical/test_logging.py
          src/frameit/testing/numerical/test_fa_baseline.py
          src/frameit/testing/numerical/test_fa_contracts.py
          src/frameit/testing/numerical/test_fa_cubes.py
          src/frameit/testing/numerical/test_fa_epygram_probe.py
          src/frameit/testing/numerical/test_fa_epygram_geometry.py
          src/frameit/testing/numerical/test_fa_epygram_surfex.py
          src/frameit/testing/numerical/test_fa_io.py
          src/frameit/testing/numerical/test_fa_resources.py
          src/frameit/testing/numerical/test_fa_surface.py
          src/frameit/testing/numerical/test_fa_mapping.py
          src/frameit/testing/numerical/test_fa_geometry.py
          src/frameit/testing/numerical/test_fa_migration.py
          src/frameit/testing/numerical/test_fa_spectral.py
          src/frameit/testing/numerical/test_coupled_shared_polar.py
          src/frameit/testing/numerical/test_arome_fa_coupling.py
          src/frameit/testing/numerical/test_fa_pipeline.py
          --junitxml=hpc-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-runtime-python-${{ matrix.python-version }}
          path: hpc-tests.xml

  fa-coupling:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install maintained EPyGrAM FA extra and GRIB reader
        run: python -m pip install -e '.[test,grib,fa]'
      - name: Require the maintained decoder dependencies
        run: |
          python -m pip check
          python -c "from importlib.metadata import version; assert {n: version(n) for n in ('epygram', 'falfilfa4py', 'ctypesForFortran', 'ectrans4py', 'netCDF4')} == {'epygram': '2.1.0', 'falfilfa4py': '1.2.1', 'ctypesForFortran': '1.3.0', 'ectrans4py': '1.6.0', 'netCDF4': '1.7.2'}"
      - name: Verify isolated native readers and coupled time/grid contracts
        run: >-
          python -m pytest -q
          src/frameit/testing/numerical/test_fa_*.py
          src/frameit/testing/numerical/test_coupled_shared_polar.py
          src/frameit/testing/numerical/test_arome_fa_coupling.py
          --basetemp=build/fa-native-tests
          --junitxml=fa-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa-coupling-python-3.13
          path: |
            fa-tests.xml
            build/fa-native-tests/**/measurements.json

  fa-spectral-candidate:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned optional transform candidate and isolated FA/GRIB readers
        run: python -m pip install -e '.[test,grib,fa,fa-spectral-test]'
      - name: Evaluate independent modes, admission gates and unchanged gridpoint behavior
        run: >-
          python -m pytest -q
          src/frameit/testing/numerical/test_fa_spectral.py
          src/frameit/testing/numerical/test_fa_io.py
          src/frameit/testing/numerical/test_fa_pipeline.py
          --junitxml=fa-spectral-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa-spectral-candidate-python-3.13
          path: fa-spectral-tests.xml

  fa-epygram-cubes:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fa-primary
          create-args: >-
            -c conda-forge python=3.13 pip esmpy=8.9.1 xesmf=0.9.2 cfgrib eccodes
      - name: Install the coherent EPyGrAM stack and parent GRIB reader
        run: |
          python -m pip install -e '.[test,grib]'
          python -m pip check
          python -m venv --system-site-packages .ci-fa-epygram
          .ci-fa-epygram/bin/python -m pip install -e '.[test,grib,fa,fa-epygram]'
      - name: Require the qualified native stack (no optional-backend skips)
        run: |
          .ci-fa-epygram/bin/python -m pip check
          .ci-fa-epygram/bin/python -c "from importlib.metadata import version; assert {n: version(n) for n in ('epygram', 'falfilfa4py', 'ctypesForFortran', 'ectrans4py', 'netCDF4')} == {'epygram': '2.1.0', 'falfilfa4py': '1.2.1', 'ctypesForFortran': '1.3.0', 'ectrans4py': '1.6.0', 'netCDF4': '1.7.2'}"
          .ci-fa-epygram/bin/python -c "import eccodes, cfgrib, xesmf, esmpy; assert esmpy.__version__ == '8.9.1' and xesmf.__version__ == '0.9.2'"
      - name: Full regressions including primary pair, shared targets, migration and cubes
        run: >-
          .ci-fa-epygram/bin/python -m pytest -q
          --junitxml=fa-epygram-tests.xml
      - name: Build and install the distributable wheel separately from the checkout
        run: |
          .ci-fa-epygram/bin/python -m pip install 'setuptools>=77' wheel
          .ci-fa-epygram/bin/python -m pip wheel --no-deps --no-build-isolation . -w build/qualified-wheel
          python -m pip install --no-deps --no-index --target build/wheel-install build/qualified-wheel/frameit-*.whl
          PYTHONPATH="$PWD/build/wheel-install" python -c "import frameit; from pathlib import Path; assert Path(frameit.__file__).is_relative_to(Path('build/wheel-install').resolve())"
      - name: Qualify packaged primary pair with the GRIB/ESMF parent and isolated FA helper
        env:
          PYTHONPATH: ${{ github.workspace }}/build/wheel-install
          FRAMEIT_TEST_EPYGRAM_PYTHON: ${{ github.workspace }}/.ci-fa-epygram/bin/python
        run: |
          .ci-fa-epygram/bin/python -c "import frameit; from pathlib import Path; assert Path(frameit.__file__).is_relative_to(Path('build/wheel-install').resolve())"
          python -m pytest -q \
            build/wheel-install/frameit/testing/numerical/test_fa_pipeline.py::test_primary_grib_epygram_surfex_native_exports \
            build/wheel-install/frameit/testing/numerical/test_coupled_shared_polar.py::test_primary_pair_shared_target_geometry_budgets_and_fresh_exports \
            build/wheel-install/frameit/testing/numerical/test_fa_resources.py \
            --junitxml=fa-wheel-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa-epygram-cubes-python-3.13
          path: |
            fa-epygram-tests.xml
            fa-wheel-tests.xml
