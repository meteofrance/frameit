[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frameit"
version = "1.1.0"
requires-python = ">=3.10"
description = "Focused Regional Analysis of Modeled Events with Integrated Tracking"
dependencies = [
    "numpy", "scipy", "xarray", "dask[array]", "PyYAML", "pyproj",
    "netCDF4", "h5netcdf", "h5py", "threadpoolctl>=3",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Clément Soufflet"},
    {name = "Kevin Hoarau"},
    {name = "Adrien Colomb"},
    {name = "Rémi Laxenaire"},
]
maintainers = [
    {name = "Clément Soufflet", email = "clement.soufflet@meteo.fr"},
]

[project.urls]
Homepage = "https://github.com/meteofrance/frameit"
Documentation = "https://meteofrance.github.io/frameit/"
Repository = "https://github.com/meteofrance/frameit"
DOI = "https://doi.org/10.5281/zenodo.22128192"

[project.scripts]
frameit = "frameit.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]
grib = ["cfgrib", "eccodes"]
polar = ["xesmf", "shapely>=2"]
fa = ["falfilfa4py==1.3.0"]
# Alternative to the fa extra: EPyGrAM supplies its own pinned native stack.
fa-epygram = ["epygram==2.1.0"]
# Candidate evaluation only; installing this extra does not admit spectral FA execution.
fa-spectral-test = ["ectrans4py==1.6.0", "ctypesForFortran==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frameit = ["presets/**/*.yaml", "templates/*.yaml", "testing/catalogs/*.yaml", "testing/recipes/*.yaml", "testing/ci_dataset/manifest.json", "testing/ci_dataset/**/*.grib", "testing/ci_dataset/**/*.nc"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["src/frameit/testing/numerical"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "DRAFT",
  "notebooks",
  "docs/build",
  "src/frameit.egg-info",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
# Ensemble volontairement conservateur, utile, peu bruyant
select = ["E", "F", "I", "UP", "B"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Fréquent dans les packages: imports ré-exportés dans __init__.py
"src/frameit/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
