[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frameit"
version = "1.0.0"
requires-python = ">=3.10"
description = "Focused Regional Analysis of Modeled Events with Integrated Tracking"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Clément Soufflet"},
    {name = "Kevin Hoarau"},
    {name = "Adrien Colomb"},
    {name = "Rémi Laxenaire"},
]
maintainers = [
    {name = "Clément Soufflet", email = "clement.soufflet@meteo.fr"},
]

[project.urls]
Homepage = "https://github.com/meteofrance/frameit"
Documentation = "https://meteofrance.github.io/frameit/"
Repository = "https://github.com/meteofrance/frameit"

[project.scripts]
frameit = "frameit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frameit = ["presets/**/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "DRAFT",
  "notebooks",
  "docs/build",
  "src/frameit.egg-info",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
# Ensemble volontairement conservateur, utile, peu bruyant
select = ["E", "F", "I", "UP", "B"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Fréquent dans les packages: imports ré-exportés dans __init__.py
"src/frameit/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"