# Full-domain AROME example: inputs must cover the 500-km reference ring.
# Adapt paths; these relative paths are resolved from this YAML file.
schema_version: 2
model: arome
run:
  name: BATSIRAI_PRESSURE_CENTROID
  description: Adaptive Nguyen pressure centroid, comparison script v1.4.1
input:
  directory: ./data/AROME/BATSIRAI
  pattern: "arome_BATSIRAI_20220201+???0P.grib"
  wind_pairs:
    - {group: surface, u: u10, v: v10, reference_frame: earth}
    - {group: isobaricInhPa, u: u, v: v, reference_frame: earth}
tracking:
  method: pressure_centroid
  pressure_centroid:
    convergence: {max_iterations: 15, tolerance_m: 250}
    motion: {max_iterations: 50, solver: aitken, relaxation: 0.25, tolerance_m: 250}
    sampling: {r80_max_distance_km: 250, radial_step_km: 2.5, azimuth_step_deg: 5}
domain:
  size_km: {x: 500, y: 500}
variables:
  surface:
    names: [u10, v10, prmsl]
  isobaricInhPa:
    names: [u, v]
    levels: {values: [850, 700]}
polar:
  enabled: true
  variables: all
  azimuth_step_deg: 10
output:
  cartesian: {horizontal_winds: mass_earth, vertical_velocity: interfaces}
  polar: {vertical_velocity: mass}
  directory: ./output/BATSIRAI_PRESSURE_CENTROID
