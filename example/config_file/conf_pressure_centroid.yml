# Full-domain AROME example: inputs must cover the 500-km reference ring.
# Adapt paths; these relative paths are resolved from this YAML file.
schema_version: 3
run:
  name: BATSIRAI_PRESSURE_CENTROID
  description: Adaptive Nguyen pressure centroid, comparison script v1.4.1
sources:
  atmosphere:
    model: arome
    format: grib
    files: "./data/AROME/BATSIRAI/arome_BATSIRAI_20220201+???0P.grib"
    wind_pairs:
      - {u: u10, v: v10, basis: earth}
      - {u: isobaricInhPa.u, v: isobaricInhPa.v, basis: earth}
    variables:
      2d: [u10, v10, prmsl]
      3d:
        isobaricInhPa:
          names: [u, v]
          levels: {values: [850, 700], units: hPa}
    transforms:
      - fields: [u10, v10, isobaricInhPa.u, isobaricInhPa.v]
        sampling: native
        basis: earth
    field_metadata:
      u10: {kind: continuous}
      v10: {kind: continuous}
      prmsl: {kind: continuous}
      isobaricInhPa.u: {kind: continuous}
      isobaricInhPa.v: {kind: continuous}
region:
  tracker:
    method: pressure_centroid
    convergence: {max_iterations: 15, tolerance_m: 250}
    motion: {max_iterations: 50, solver: aitken, relaxation: 0.25, tolerance_m: 250}
    sampling: {r80_max_distance_km: 250, radial_step_km: 2.5, azimuth_step_deg: 5}
  width_km: {x: 500, y: 500}
products:
  model_grid: true
  track: true
  polar: {radius_km: 250, azimuth_count: 36}
output:
  directory: ./output/BATSIRAI_PRESSURE_CENTROID
