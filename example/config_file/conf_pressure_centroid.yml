# Full-domain AROME Batsirai example; edit the input/output directories.
# The input must cover the entire 500-km environmental pressure ring.
simulation_name: BATSIRAI_PRESSURE_CENTROID
file_name_prefix: ""
file_name: "arome_BATSIRAI_20220201+"
file_name_suffix: "0P."
file_type: grib
atm_model: AROME
ocean_model: "None"
wave_model: "None"
resolution: 2500
comment: "Adaptive Nguyen pressure centroid, comparison script v1.4.1"
simulation_output_dir: /path/to/AROME/BATSIRAI
frameit_output_dir: /path/to/output/BATSIRAI_PRESSURE_CENTROID

tracking_method: pressure_centroid
pressure_centroid_max_iterations: 15
pressure_centroid_tolerance_m: 250.0
pressure_centroid_max_motion_iterations: 50
pressure_centroid_motion_solver: aitken
pressure_centroid_motion_relaxation: 0.25
pressure_centroid_motion_tolerance_m: 250.0
pressure_centroid_r80_max_km: 250.0
pressure_centroid_dr_km: 2.5
pressure_centroid_dtheta: 5.0

x_boxsize_km: 500.0
y_boxsize_km: 500.0
requested_variables_user:
  surface:
    variables: [u10, v10, prmsl]
  isobaricInhPa:
    variables: [u, v]
    level_selection: values
    level_values: [850, 700]

compute_polar_proj: true
radial_resolution: 2500
azimuthal_resolution: 10
field_orientation: geodesic
polar_variables:
  surface:
    variables: [u10, v10, prmsl]
  isobaricInhPa:
    variables: [u, v]
