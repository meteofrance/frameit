schema_version: 3
run:
  name: croco-mesonh
sources:
  ocean:
    model: croco
    format: netcdf
    files: "./data/croco/*_his.nc"
    variables:
      # Adapt indices to the inspected native sigma axis; these are not metres.
      3d: [temp, salt, u, v, w]
      levels: {indices: [0, 49]}
      2d: [zeta]
    wind_pairs:
      - {u: u, v: v, basis: grid, rotation: {method: coordinate, coordinate: angle}}
    # Explicit rho/Earth currents; joint native-face masks are retained.
    transforms:
      - {fields: [u, v], sampling: mass, basis: earth, units: "m s-1"}
  atmosphere:
    model: mesonh
    format: netcdf
    files: "./data/mesonh/*diag.nc"
    # Explicit embedded SEA interpretation; no inferred flux sign or timing.
    interpretation: mesonh_surfex_sea
    variables:
      2d: [MSLP, SST, SSS, H_SEA, LE_SEA, FMU_SEA, FMV_SEA, FRAC_SEA]
      3d: [PRES]
      levels: {indices: [1, 70]}
region:
  sources_coupling_time_association: common
  # Illustrative common-ocean centre, not an identified cyclone position.
  center: {latitude: -11.0, longitude: 55.0}
  width_km: {x: 100, y: 100}
products:
  model_grid: true
  track: true
  # Polar sampling is unrequested; sigma levels are not constant-depth sections.
resources:
  native_threads: 1
  compute_workers: 1
  synchronous_export: true
  export_workers: 1
output:
  directory: ./output/croco-mesonh
  overwrite: false
  format: netcdf
