# Separate atmosphere/surface products on one explicitly selected polar target.
# Adapt paths, centre and selections. This is not a scientific qualification preset.
# Coupled sampling and producer limits: docs/source/user_guide/fa_surface.rst.
schema_version: 3
run:
  name: cyclone-coupled-polar
sources:
  atmosphere:
    model: arome
    format: grib
    files: "./data/atmosphere/*.grib"
    # Explicit declarations: check actual GRIB uvRelativeToGrid flags first.
    wind_pairs:
      - {u: u10, v: v10, basis: earth}
      - {u: isobaric.u, v: isobaric.v, basis: earth}
    variables:
      2d: [prmsl, u10, v10]
      3d:
        isobaric:
          names: [u, v, t, r, z]
          levels: {values: [850, 700, 500], units: hPa}
    field_metadata:
      prmsl: {kind: continuous}
      isobaric.t: {kind: continuous}
      isobaric.r: {kind: continuous}
      isobaric.z: {kind: continuous}
  surface:
    model: arome
    format: fa
    files: "./data/surface/historic.surfex*.fa"
    # The active frameit_env Python runs isolated FA workers.
    profile: surfex_history
    fa:
      subdomain: CI
      # Native geometry is checked before shared-target sampling/budgets.
      expected_source: {PROGRAM: AROME, VERSION: 8, BUG: 1, MASDEV: 47, BUGFIX: 0}
      # Inspection declaration only: confirm the actual producer Earth model.
      earth_radius_m: 6371229.0
    field_metadata:
      # Review source units/time support. Unresolved scaling fails by default;
      # an identity fallback needs independent producer/release-specific evidence.
      SFX.T2M:
        units: K
        kind: continuous
        temporal_kind: instantaneous
        allow_unscaled: false
      SFX.SST:
        units: K
        kind: continuous
        temporal_kind: instantaneous
        allow_unscaled: false
    variables:
      2d: [SFX.T2M, SFX.SST]
region:
  # Select the common-time subset explicitly, with warnings and exclusions.
  # exact needs centres at every selected source time, not identical source clocks.
  sources_coupling_time_association: common
  track:
    # Exact Gregorian time, latitude/longitude in geographic degrees; no index reuse.
    # Every continuous atmospheric centre is applied to SURFEX at that same time.
    file: ./data/track.nc
  width_km: {x: 40, y: 40}
products:
  model_grid: true
  track: true
  polar:
    # Native winds stay in model-grid products. Only scalar polar quantities:
    # no wind diagnostic, pressure/height diagnosis or interval conversion.
    fields:
      atmosphere: [prmsl, isobaric.t, isobaric.r, isobaric.z]
      surface: [SFX.T2M, SFX.SST]
    radius_km: 20
    # No finer than any participating source's native spacing.
    radial_step_km: 4
    azimuth_count: 72
    shared_grid: true
    missing_data_policy: strict
output:
  directory: ./output/cyclone-coupled-polar
  overwrite: false
resources:
  export_workers: 1
  synchronous_export: true
