# FrameIt schema v2. Adapt example paths and native variables to your dataset.
# Paths are relative to this YAML file. Grid spacing is inferred automatically.
schema_version: 2
model: arome
run:
  name: BATSIRAI
  description: AROME Batsirai analysis
input:
  directory: ./data/AROME/BATSIRAI
  pattern: "arome_BATSIRAI_20220201+???0P.grib"
tracking:
  method: wind_pressure
domain:
  # Full widths in kilometres; omit size_km for the full domain.
  size_km: {x: 500, y: 500}
variables:
  surface:
    names: [u10, v10, prmsl]
  # Native pressure-level values are hPa, not calculation units (Pa).
  # isobaricInhPa:
  #   names: [u, v]
  #   levels: {values: [850, 700]}
polar:
  enabled: false
  variables: all
  # radial_step_m: 2500  # Metres; omitted means inferred native spacing.
  # azimuth_count: 64   # Alternatively azimuth_step_deg; never both.
output:
  directory: ./output/BATSIRAI
