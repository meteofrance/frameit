# Adapt example paths and native variables to your dataset.
# Paths are relative to this YAML file. Grid spacing is inferred automatically.
schema_version: 3
run:
  name: BATSIRAI
  description: AROME Batsirai analysis
sources:
  atmosphere:
    model: arome
    files: "./data/AROME/BATSIRAI/arome_BATSIRAI_20220201+???0P.grib"
    wind_pairs:
      - {u: u10, v: v10, basis: earth}
      - {u: u, v: v, basis: earth}
    variables:
      2d: [u10, v10, prmsl]
      # A flat 3d list needs unambiguous names and one shared level selector.
      # Inspect the files before adding 3d: [u, v], levels: {values: [850, 700], units: hPa}.
    transforms:
      - {fields: [u10, v10], sampling: native, basis: earth}
region:
  tracker:
    method: pressure_wind
  # Full widths in kilometres; omit width_km for the full domain.
  width_km: {x: 500, y: 500}
products:
  model_grid: true
  track: true
  # To request polar sampling, declare its radius_km and optional azimuth_count.
output:
  directory: ./output/BATSIRAI
