# Paths are relative to this YAML. Adapt them and review the field declarations.
# Limited dense instantaneous scalar example, not full FA qualification.
# Reader scope/scaling limits: docs/source/user_guide/fa_inputs.rst.
# Source geometry/metadata: docs/source/user_guide/fa_geometry.rst.
# Coupled grid/time products: docs/source/user_guide/fa_surface.rst.
# Compact fixture success does not establish real-producer scaling/units/support.
schema_version: 3
run:
  name: coupled-surface
sources:
  atmosphere:
    model: arome
    format: grib
    files: "./data/atmosphere/*.grib"
    variables:
      3d:
        heightAboveGround:
          names: [t2m]
          levels: {values: [2], units: m}
  surface:
    model: arome
    format: fa
    files: "./data/surfex/historic.surfex*.fa"
    profile: surfex_history
    reader:
      # Omit python_executable: isolated workers use frameit_env's active Python.
      max_points: 20000000
      timeout_seconds: 120
    fa:
      # Optional exact producer assertions, not overrides or scientific definitions.
      # E.g. {PROGRAM: AROME, VERSION: 8, BUG: 1, MASDEV: 47, BUGFIX: 0}
      # only after checking the actual source metadata.
      expected_source: {}
      subdomain: CI
      # Admitted projected FA uses its source CRS/native axes for index lookup.
      # Products retain requested/selected centres and snapping offsets.
      # Explicit declaration, NOT a universal FA default: verify with the producer.
      earth_radius_m: 6371229.0
    field_metadata:
      SFX.T2M:
        units: K
        long_name: "2 metre air temperature (explicit source declaration)"
        kind: continuous
        temporal_kind: instantaneous
        # Units alone cannot justify bypassing missing native scaling.
        allow_unscaled: false
    variables:
      2d: [SFX.T2M]
region:
  # Select the common-time subset explicitly, with warnings and exclusions.
  # exact instead needs centres at every source time; source clocks may differ.
  sources_coupling_time_association: common
  center: {latitude: -15.0, longitude: 50.15}
  width_km: {x: 40, y: 40}
products:
  model_grid: true
  track: true
  # Polar is unselected. If adding it, explicitly choose shared_grid and a step
  # no finer than the coarsest participating native source.
output:
  directory: ./output/coupled-surface
  overwrite: false
