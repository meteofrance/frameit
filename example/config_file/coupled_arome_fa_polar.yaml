# Native AROME atmospheric FA + AROME-produced SURFEX FA, separate products.
# Explicit instantaneous gridpoint scalars only; spectral/3-D fields are gated.
# Adapt paths/centre and confirm the source units and producer Earth model.
schema_version: 2
model: arome
run:
  name: arome-sfx-fa
input:
  time_alignment: common
  sources:
    atmosphere:
      model: arome
      input:
        directory: ./data/atmosphere
        pattern: "historic.arome*.fa"
        format: fa
        fa:
          profile: arome_history
          subdomain: CI
          # Inspection declaration, not an inferred universal FA Earth model.
          earth_radius_m: 6371229.0
          field_metadata:
            CLSTEMPERATURE:
              units: K
              kind: continuous
              temporal_kind: instantaneous
              allow_unscaled: false
      variables:
        surface:
          names: [CLSTEMPERATURE]
    surface:
      model: arome
      input:
        directory: ./data/surface
        pattern: "historic.surfex*.fa"
        format: fa
        fa:
          profile: surfex_history
          subdomain: CI
          expected_source: {PROGRAM: AROME, VERSION: 8, BUG: 1, MASDEV: 47, BUGFIX: 0}
          earth_radius_m: 6371229.0
          field_metadata:
            # Declarations are not codec definitions. The supplied real T2M
            # currently fails the native scaling guard; do not enable fallback
            # without independent justification for this producer/release.
            SFX.T2M:
              units: K
              kind: continuous
              temporal_kind: instantaneous
              allow_unscaled: false
            SFX.SST:
              units: K
              kind: continuous
              temporal_kind: instantaneous
              allow_unscaled: false
      variables:
        surface:
          names: [SFX.T2M, SFX.SST]
tracking:
  source: atmosphere
  method: fixed_box
  fixed_box:
    center: {latitude: -15.0, longitude: 50.15}
domain:
  size_km: {x: 40, y: 40}
polar:
  enabled: true
  shared_target: true
  radial_step_m: 4000
  azimuth_count: 72
  interpolation_method: bilinear
  missing_data_policy: strict
output:
  directory: ./output/arome-sfx-fa
  overwrite: false
  max_workers: 1
  synchronous_export: true
