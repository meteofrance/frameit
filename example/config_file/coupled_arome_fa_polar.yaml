# Native AROME atmospheric FA + AROME-produced SURFEX FA, separate products.
# Explicit instantaneous gridpoint scalars only; no spectral or cube request.
# The optional fa-spectral-test extra evaluates ecTrans; it does not enable
# S001 spectral fields here. See docs/source/user_guide/fa_spectral.rst for gates.
# Native vertical-header facts are retained as provenance, not pressure/height axes.
# Adapt paths/centre and confirm the source units and producer Earth model.
# Both FA sources use the default EPyGrAM reader (FrameIt[fa]).
# Configuration reference: docs/source/user_guide/configuration_file.rst.
schema_version: 3
run:
  name: arome-sfx-fa
sources:
  atmosphere:
    model: arome
    format: fa
    files: "./data/atmosphere/historic.arome*.fa"
    profile: arome_history
    fa:
      subdomain: CI
      # Inspection declaration, not an inferred universal FA Earth model.
      earth_radius_m: 6371229.0
    field_metadata:
      CLSTEMPERATURE:
        units: K
        kind: continuous
        temporal_kind: instantaneous
        allow_unscaled: false
    variables:
      2d: [CLSTEMPERATURE]
  surface:
    model: arome
    format: fa
    files: "./data/surface/historic.surfex*.fa"
    profile: surfex_history
    fa:
      # Keep the complete source/directory; incomplete SFX.* is not atmospheric FA.
      subdomain: CI
      expected_source: {PROGRAM: AROME, VERSION: 8, BUG: 1, MASDEV: 47, BUGFIX: 0}
      earth_radius_m: 6371229.0
    field_metadata:
      # Unresolved scaling fails by default. An identity fallback needs independent
      # producer/release-specific evidence; unit declarations do not define a codec.
      SFX.T2M:
        units: K
        kind: continuous
        temporal_kind: instantaneous
        allow_unscaled: false
      SFX.SST:
        units: K
        kind: continuous
        temporal_kind: instantaneous
        allow_unscaled: false
    variables:
      2d: [SFX.T2M, SFX.SST]
region:
  sources_coupling_time_association: common
  center: {latitude: -15.0, longitude: 50.15}
  width_km: {x: 40, y: 40}
products:
  model_grid: true
  track: true
  polar:
    # Native geometries are checked before common sampling and its full-time budget.
    radius_km: 20
    radial_step_km: 4
    azimuth_count: 72
    shared_grid: true
    missing_data_policy: strict
output:
  directory: ./output/arome-sfx-fa
  overwrite: false
resources:
  export_workers: 1
  synchronous_export: true
