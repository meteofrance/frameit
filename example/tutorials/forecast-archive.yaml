schema_version: 3
run: {name: forecast-archive}
sources:
  atmosphere:
    model: arome
    format: netcdf
    files: ./forecast-archive/*.nc
    time:
      cycle: "2000-01-01T00:00:00"  # Use only this forecast start.
      start: "2000-01-01T01:00:00"  # Both valid-time endpoints are included.
      end: "2000-01-01T02:00:00"
    variables:
      2d: [prmsl]
products:
  model_grid: true
output: {directory: ./results/forecast-archive}
resources: {cpus: 1, scheduler: synchronous, synchronous_export: true}
