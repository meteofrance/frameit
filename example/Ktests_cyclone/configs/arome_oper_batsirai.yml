# Adapt paths and selections to the actual model files. Paths are YAML-relative.
schema_version: 2
model: arome
run: {name: BATSIRAI, description: AROME Batsirai analysis}
input:
  directory: ./data/AROME/BATSIRAI
  pattern: "arome_BATSIRAI_20220201+???0P.grib"
  wind_pairs:
    - {group: heightAboveGround, u: u, v: v, reference_frame: earth}
    - {group: isobaricInhPa, u: u, v: v, reference_frame: earth}
    - {group: surface, u: u10, v: v10, reference_frame: earth}
tracking:
  method: fixed_box
  fixed_box:
    center: {latitude: -18, longitude: 58}
domain:
  size_km: {x: 500, y: 500}  # Full widths in km
variables:
  heightAboveGround:
    names: [u, v, t, r, tke]
    levels: {indices: [0, 2, 5]}
  isobaricInhPa:
    names: [u, v]
    levels: {values: [1000, 850, 400]}  # Native hPa
  surface:
    names: [u10, v10, prmsl, sshf, slhf]
polar:
  enabled: true
  variables: all
  azimuth_step_deg: 10
output:
  cartesian: {horizontal_winds: mass_earth, vertical_velocity: interfaces}
  polar: {vertical_velocity: mass}
  directory: ./output/BATSIRAI
