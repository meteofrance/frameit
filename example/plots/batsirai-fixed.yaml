# Illustration inputs only: adapt this directory to the two BATSIRAI diagnostic files.
schema_version: "2.1"
model: mesonh
run:
  name: batsirai-fixed
input:
  directory: ./data/BATSIRAI-10mins
  pattern: '*dg.nc'
  format: netcdf
  wind_pairs:
    # The files describe Earth-relative zonal/meridian 10-m winds in m s-1.
    - {group: fields_2d, u: UM10, v: VM10, reference_frame: earth}
tracking:
  method: fixed_box
  fixed_box:
    # First-time MSLP minimum in these files; held fixed for the comparison.
    center: {latitude: -16.342215392786485, longitude: 62.15487544109405}
domain:
  width_km: {x: 500, y: 500}
variables:
  fields_2d:
    names: [UM10]
polar:
  enabled: true
  radial_step_m: 6000
  azimuth_count: 180
output:
  directory: ./batsirai-fixed
  overwrite: false
  synchronous_export: true
execution:
  dask_scheduler: synchronous
  native_threads: 1
