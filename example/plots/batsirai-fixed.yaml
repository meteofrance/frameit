# Illustration inputs only: adapt this directory to the two BATSIRAI diagnostic files.
schema_version: 3
run:
  name: batsirai-fixed
sources:
  atmosphere:
    model: mesonh
    files: './data/BATSIRAI-10mins/*dg.nc'
    format: netcdf
    wind_pairs:
      # The files describe Earth-relative zonal/meridian 10-m winds in m s-1.
      - {u: UM10, v: VM10, basis: earth}
    variables:
      2d: [UM10]
    field_metadata:
      UM10: {kind: continuous}
region:
  # First-time MSLP minimum in these files; held fixed for the comparison.
  center: {latitude: -16.342215392786485, longitude: 62.15487544109405}
  width_km: {x: 500, y: 500}
products:
  model_grid: true
  track: true
  polar: {radius_km: 250, radial_step_km: 6, azimuth_count: 180}
output:
  directory: ./batsirai-fixed
  overwrite: false
resources:
  synchronous_export: true
  scheduler: synchronous
  native_threads: 1
