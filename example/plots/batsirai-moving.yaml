# Same two read-only inputs; only horizontal fields are required.
schema_version: 3
run:
  name: batsirai-moving
sources:
  atmosphere:
    model: mesonh
    files: './data/BATSIRAI-10mins/*dg.nc'
    format: netcdf
    wind_pairs:
      # These files explicitly describe zonal/meridian 10-m winds, in m s-1.
      - {u: UM10, v: VM10, basis: earth}
    variables:
      2d: [UM10]
region:
  tracker: {method: pressure_wind}
  width_km: {x: 500, y: 500}
products:
  model_grid: true
  track: true
output:
  directory: ./batsirai-moving
  overwrite: false
resources:
  synchronous_export: true
  scheduler: synchronous
  native_threads: 1
